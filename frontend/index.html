<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Downloader</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>YouTube Downloader</h1>
    <p class="sub">Paste a link. Formats load automatically. Start a new download anytime.</p>

    <label for="url">YouTube URL</label>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

    <div class="row">
      <div class="col">
        <label for="mode">Output</label>
        <select id="mode">
          <option value="video">MP4 (video)</option>
          <option value="audio">MP3 (audio)</option>
        </select>
      </div>
      <div class="col">
        <label for="format">Resolution</label>
        <select id="format" disabled>
          <option>Paste a link first…</option>
        </select>
      </div>
    </div>

    <div class="row">
      <button id="go" type="button" disabled>Download</button>
    </div>

    <!-- Jobs List -->
    <div id="jobs-container" class="jobs"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
